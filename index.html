<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <ul>
            <li><img src="brand logo.png" alt="brand"></li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>
    <div class="container">
        <h1>Best of NCS- No copyright Sounds</h1>
        <div class="songList">
            <div class="songItem">
                <img src="artworks-MI8nfS59NoJ5-0-t500x500.jpg" alt="cover" height="40px" width="40px">
                <span class="songname">Those Eyes</span>
                <div class="SongItemplay songlistPlay">
                           <i class="iclass fas fa-2x fa-solid fa-play"></i>
                </div>
                </div>
                <div class=" songItem songItem1">
                  <img src="artworks-MI8nfS59NoJ5-0-t500x500.jpg" alt="cover" height="40px" width="40px">
                <span class="songname">Rana kumbha</span>
                <div class="SongItemplay songlistPlay1">
                           <i class="iclass fas fa-2x fa-solid fa-play"></i>
                </div>
                </div>
                   <div class="songItem songItem2">
                  <img src="artworks-MI8nfS59NoJ5-0-t500x500.jpg" alt="cover" height="40px" width="40px">
                <span class="songname">Rana Sanga</span>
                <div class="SongItemplay songlistPlay2">
                           <i class="iclass fas fa-2x fa-solid fa-play"></i>
                </div>
                </div>
            </div>

        </div>
        <div class="songlist"></div>
        <div class="songbanner"></div>
    </div>
    <div class="bottom">
         <div class="songinfo">
            <img src="gifpic.gif" id="gif" alt="play" height="100px" width="100px">

        </div>
        <input type="range" class="range" id="progressbar" value="0" min="0" max="100">
        <div class="icons">
            <i class="fas fa-2x fa-solid fa-backward-step" id="previous"></i>
            <i class="fas fa-2x fa-solid fa-play" id="masterPlay"></i>
            <i class="fas fa-2x fa-solid fa-forward-step" id="next"></i>
        </div>
       
    </div>
    <script src="script.js"></script>
    <script src="https://kit.fontawesome.com/469d354d29.js" crossorigin="anonymous"></script>
</body>

</html>
